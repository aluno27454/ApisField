# Catálogo de versões: todas as dependências do projeto são declaradas aqui,
# para haver um único sítio onde atualizar versões.
# Cada biblioteca está justificada em docs/ARQUITETURA.md e no ecrã Sobre.

[versions]
# O AGP fica igual ao do template das aulas: o Android Studio só suporta versões até à sua.
agp = "9.5.0"
coreKtx = "1.19.1"
appcompat = "1.8.0"
material = "1.14.0"
activityKtx = "1.13.0"
constraintlayout = "2.2.2"
navigation = "2.10.2"
retrofit = "3.0.0"
# O OkHttp fica na versão de que o Retrofit 3.0.0 depende; a 5.x muda a API do MockWebServer.
okhttp = "4.12.0"
coroutines = "1.11.0"
# Room 2.x: a linha estável usada pela documentação oficial (a 3.x muda de pacote e obriga a um SQLiteDriver).
room = "2.8.5"
ksp = "2.3.14"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"

[libraries]
# Base do template das aulas
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# Navegação entre os separadores da barra inferior
androidx-navigation-fragment-ktx = { group = "androidx.navigation", name = "navigation-fragment-ktx", version.ref = "navigation" }
androidx-navigation-ui-ktx = { group = "androidx.navigation", name = "navigation-ui-ktx", version.ref = "navigation" }
# Rede: cliente REST (Retrofit), conversão de JSON (Gson) e cliente HTTP (OkHttp)
retrofit = { group = "com.squareup.retrofit2", name = "retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { group = "com.squareup.retrofit2", name = "converter-gson", version.ref = "retrofit" }
okhttp = { group = "com.squareup.okhttp3", name = "okhttp", version.ref = "okhttp" }
okhttp-logging = { group = "com.squareup.okhttp3", name = "logging-interceptor", version.ref = "okhttp" }
# Coroutines: rede e base de dados fora da thread principal
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
# Base de dados local: Room (runtime, extensões para coroutines e gerador de código usado pelo KSP)
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
# Testes
okhttp-mockwebserver = { group = "com.squareup.okhttp3", name = "mockwebserver", version.ref = "okhttp" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# KSP: gera, durante a compilação, o código do Room a partir das anotações (@Entity, @Dao...)
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
